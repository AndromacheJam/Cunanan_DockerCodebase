# ============================================================
# SERVER 1 - MAIN SYSTEM (Hotel Reservation CRUD) - PORT 80
# ============================================================
server {
    listen 80;
    server_name localhost;

    root /var/www/main_system;
    index index.html index.php;

    access_log /var/log/nginx/main_system.access.log;
    error_log  /var/log/nginx/main_system.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}

# ============================================================
# SERVER 2 - MICROSERVICE (Employee API) - PORT 81
# ============================================================
server {
    listen 81;
    server_name localhost;

    root /var/www/microservice;
    index index.php index.html;

    access_log /var/log/nginx/microservice.access.log;
    error_log  /var/log/nginx/microservice.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php_microservice:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}
